# The roadmap, as data. docs_hooks/roadmap.py (from passageway, by way of noticebox) renders it as the timeline on the roadmap page.
#
# Open entries (status now, next or later) are shown first, in the order of this file, each with a `when` label and `details`.
# Done entries are shown below them, newest date first, each with a `date` and a link to its pull request or release.
# `icon` is the name of a Material Design icon (https://pictogrammers.com/library/mdi/).

items:
  # ---- open ------------------------------------------------------------------------------------------------------------
  - id: first-release
    status: now
    when: Now
    icon: bridge
    title: The first release
    summary: An accepted submission becomes client, draft quote and documents in Invoice Ninja, by a mapping per form, retried by itself.
    details: |
      Built for 3dbruckner.de's order form and its Invoice Ninja; generic from the start, so any noticebox form that ends in a quote can use it.
    links:
      - { label: "V1", url: "https://noticebox.github.io/invoiceninja-bridge/values/#v1" }
